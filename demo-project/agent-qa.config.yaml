# agent-qa Demo Project
workspace:
  testMatch:
    - tests/web/**/*.yaml
    - tests/mobile/**/*.yaml
    - tests/farm/**/*.yaml
  agentRules: ./agent-rules.md
  envFile: .env
  secretsFile: .env.secrets.local
services:
  cache:
    dir: .agent-qa/cache
    ttl: 7d
  accessibility:
    enabled: true
    standard: wcag2aa
    runAfter: every-step
    failOnViolation: false
  memory:
    dir: agent-qa-memory
registry:
  llms:
    - name: gemini-flash
      provider: openai-compatible
      model: genailab-maas-gpt-5.4
      baseURL: https://genailab.tcs.in
  targets:
    wai-bad:
      platform: web
      url: https://www.w3.org/WAI/demos/bad/before/home.html
    genesis-join:
      platform: web
      url: https://www.genesisenergy.co.nz/join
use:
  llm: gemini-flash
  mobile:
    appState: preserve
