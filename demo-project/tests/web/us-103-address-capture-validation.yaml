name: US-103 Address Capture and Validation
test-id: t_every-amma-umph-pir-mass-oil-most-wand-death-time
target: genesis-join
use:
  browser:
    headless: true
    name: chromium
    viewport:
      height: 720
      width: 1280
  cache: false
  timeout:
    step: 3m
    test: 30m
context: |
  The residential customer onboarding web app is available at https://www.genesisenergy.co.nz/join.
  The test is executed as an anonymous customer starting from a fresh session.
  The goal is to verify US-103: Address Capture and Validation.
  This includes testing that searching for a fake address "Fake Address 999" returns no results, then clearing and entering a valid address suggestion (like Unit 1, 100 Queen Street) populates the field and reveals ICP details. We also verify the primary residence checkbox is checked by default, and proceed to the fuel choice step.
steps:
  - Verify the page heading says "What's your address?"
  - Type "Fake Address 999" into the address search input
  - Verify that the autocomplete suggestion list is empty or shows "No results
    found"
  - Clear the address search input and type "100 Queen Street, Auckland Central"
  - Click the matching address suggestion for the valid test address
  - Verify the page shows headings for "ICP Address" and "ICP Number for
    Electricity"
  - Click the Continue button
  - Verify the next page asks "What energy types are you looking for?"
