test-id: t_mann-venus-pari-rase-gage-fast-primer-oint-alter-foo
name: US-102 Capture Primary Applicant Details
target: genesis-join
use:
  browser:
    name: chromium
    headless: true
    viewport:
      width: 1280
      height: 720
  cache: false
  timeout:
    step: 3m
    test: 30m
context: |
  The residential customer onboarding web app is available at https://www.genesisenergy.co.nz/join.
  The test is executed as an anonymous customer starting from a fresh session.
  The goal is to verify US-102: Capture Primary Applicant Details.
  This includes validating Title, First Name, Last Name, Date of Birth, and Phone/Mobile.
  We test negative/validation paths on the Mobile field (entering '021' triggers a length error) and Date of Birth field (entering '01/01/2015' triggers an underage error), and then verify that entering valid details allows proceeding.
steps:
  - Verify the page heading says "What's your address?"
  - Type "100 Queen Street, Auckland Central" into the address search input
  - Click the matching address suggestion for the valid test address
  - Verify the page shows headings for "ICP Address" and "ICP Number for Electricity"
  - Click the Continue button
  - Verify the next page asks "What energy types are you looking for?"
  - Click the "Electricity Only" button
  - Click the Continue button
  - Verify the plans page heading says "Which plan works for you?"
  - Verify the plans page shows the available electricity plan options
  - Click the "Select PowerHome plan" button
  - Verify the PowerHome plan is highlighted as selected
  - Click the Continue button
  - Verify the contact details form is displayed
  - Select "Mr" as the Title
  - Type "John123" into the First Name field
  - Clear the First Name field and type "John"
  - Type "Doe" into the Last Name field
  - Type "021" into the Mobile field
  - Verify a validation error appears for the Mobile field saying "Phone number must be at least 7 digits"
  - Clear the Mobile field and type "0211234567"
  - Type "john.doe@example.com" into the Email field
  - Type "01/01/2015" into the Date of Birth field
  - Verify a validation error appears for the Date of Birth field saying "Sorry, you must be over 18"
  - Clear the Date of Birth field and type "01/01/1990"
  - Click "Yes" for the New Zealand driver's licence question
  - Type "AA123456" into the Driver's Licence Number field
  - Type "500" into the Driver's Licence Card Number or Version field
  - Click the Continue button
  - Verify the property details step is loaded successfully
